name: Build LookLite Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Bun (Web Engine Bundler)
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Color Science & 3D LUT Verification
        run: |
          node scripts/verify-filters.js

      - name: Bundle WebGL2 Engine & 3D LUT Assets
        run: |
          bun build web/app.js --outfile web/bundle.js --target browser
          mkdir -p app/src/main/assets/luts
          cp web/index.html web/bundle.js web/styles.css app/src/main/assets/
          cp luts/*.cube app/src/main/assets/luts/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: List Generated APKs
        run: |
          ls -lh app/build/outputs/apk/release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LookLite-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
