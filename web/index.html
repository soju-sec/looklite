<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LookLite Preview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>LookLite</h1>
        <p class="sub">Preset first · Fine-tune second</p>
      </div>
      <div class="actions">
        <label class="file">
          Open image
          <input id="file" type="file" accept="image/*" hidden />
        </label>
        <button type="button" id="reset">Reset adjust</button>
        <button type="button" id="before" class="hold">Hold = Before</button>
      </div>
    </header>

    <main>
      <section class="canvas-wrap">
        <canvas id="gl"></canvas>
        <p id="status" class="status">Loading…</p>
      </section>

      <aside class="panel">
        <div class="brands" id="brands"></div>
        <div class="presets" id="presets"></div>

        <nav class="tabs" id="tabs">
          <button type="button" data-tab="light" class="active">Light</button>
          <button type="button" data-tab="color">Color</button>
          <button type="button" data-tab="effects">Effects</button>
        </nav>

        <div class="sliders" id="sliders"></div>
      </aside>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
